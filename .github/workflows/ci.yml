name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools examples
      - name: Docs up to date
        run: python tools/gen_docs.py --check
      - name: Doctor
        run: basilisk-mcp --data-dir "$RUNNER_TEMP/bsk-mcp" doctor
      - name: Tests
        run: pytest -q

  test-without-basilisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no Basilisk)
        run: pip install -e ".[test]"
      - name: Tests (Basilisk-dependent tests are skipped)
        run: pytest -q
